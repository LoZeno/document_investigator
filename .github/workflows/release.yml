name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary_name: document_investigator.exe
            asset_name: document_investigator-windows-x86_64.zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: document_investigator
            asset_name: document_investigator-linux-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: document_investigator
            asset_name: document_investigator-macos-arm64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: document_investigator
            asset_name: document_investigator-macos-x86_64.zip

    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      _CL_: /std:c++17 /EHsc /bigobj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libdbus-1-dev \
            libasound2-dev

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Asset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          STAGING="document_investigator-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$STAGING/"
          cp README.md LICENSE "$STAGING/"
          7z a "${{ matrix.asset_name }}" "$STAGING"

      - name: Package Release Asset (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGING="document_investigator-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$STAGING/"
          cp README.md LICENSE "$STAGING/"
          zip -r "${{ matrix.asset_name }}" "$STAGING"

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
