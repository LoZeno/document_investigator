[package]
name = "document_investigator"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
rfd = "0.15"
duckdb = { version = "1.2", features = ["bundled", "vtab"] }
fastembed = "4.5"
lopdf = { version = "0.35", features = ["nom"] }
zip = "9.0"
quick-xml = "0.37"
keyring = { version = "3.6", features = ["windows-native", "sync-secret-service", "apple-native"] }
aes-gcm = "0.10"
rand = "0.8"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
opener = "0.7"
which = "7.0"
tempfile = "3.17"

[dev-dependencies]
tempfile = "3.17"
